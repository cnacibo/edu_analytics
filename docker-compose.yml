services:
  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    container_name: edu-analytics-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PYTHONPATH: /app
      HEALTHCHECK_URL: ${HEALTHCHECK_URL}
    ports:
      - "8080:8080"
    volumes:
      - ./backend/app:/app/app # удалить эту строку после завершения разработки
      - ./storage/files:/app/storage/files:ro
    networks:
      - edu-net
    healthcheck:
      test: [ "CMD-SHELL", "curl -f $${HEALTHCHECK_URL}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  postgres:
    image: postgres:16
    container_name: edu-analytics-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - edu-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-edu_user} -d ${POSTGRES_DB:-edu_analytics}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: edu-analytics-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - edu-net
    environment:
      REACT_APP_API_URL: ${REACT_APP_API_URL}
      REACT_APP_YANDEX_MAPS_API_KEY: ${REACT_APP_YANDEX_MAPS_API_KEY}

networks:
  edu-net:
    driver: bridge

volumes:
  postgres_data:
